name: VACnet Site Tracker
run-name: ${{ github.event_name == 'schedule' && 'Scheduled 6h check' || (inputs.force_snapshot && 'Manual check (force snapshot)' || 'Manual check') }}

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_snapshot:
        description: "Save a snapshot even when no change is detected"
        required: false
        default: false
        type: boolean

concurrency:
  group: vacnet-site-tracker
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  track:
    name: Check VACnet site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STEAM_COOKIE: ${{ secrets.STEAM_COOKIE }}
      FORCE_SNAPSHOT: ${{ inputs.force_snapshot || false }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tracker/requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement tracker/requirements.txt

      - name: Run tracker
        id: tracker
        env:
          FORCE_SNAPSHOT: ${{ inputs.force_snapshot }}
        shell: bash
        run: |
          set +e
          python tracker/track.py
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -eq 2 ]; then
            exit 1
          fi

      - name: Commit snapshot
        if: steps.tracker.outputs.exit_code == '1' || steps.tracker.outputs.first_run == 'true' || inputs.force_snapshot == true
        shell: bash
        run: |
          git config user.name "VACnet Tracker Bot"
          git config user.email "vacnet-tracker[bot]@users.noreply.github.com"
          git add snapshots/ CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No snapshot files changed."
            exit 0
          fi
          if [ "${{ steps.tracker.outputs.first_run }}" = "true" ]; then
            git commit -m "chore: save initial VACnet snapshot"
          else
            git commit -m "chore: update VACnet site snapshot (${{ steps.tracker.outputs.variant }})"
          fi
          git push
          git tag -f "${{ steps.tracker.outputs.variant }}"
          git push origin "${{ steps.tracker.outputs.variant }}" --force

      - name: Package release archives
        if: steps.tracker.outputs.first_run == 'true' || inputs.force_snapshot == true || steps.tracker.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p release_assets
          python -c "
          import shutil, os
          from pathlib import Path
          variant = '${{ steps.tracker.outputs.variant }}'
          changed = '${{ steps.tracker.outputs.changed }}' == 'true'
          ts = '${{ steps.tracker.outputs.timestamp }}'
          v_name = f'{variant}_update_{ts}' if changed else variant
          shutil.make_archive(f'release_assets/{v_name}', 'zip', f'snapshots/current/{variant}')
          extra_dir = Path('release_assets/extra_pages')
          extra_dir.mkdir(parents=True, exist_ok=True)
          if Path('snapshots/current/portal').exists():
              shutil.copytree('snapshots/current/portal', extra_dir / 'portal', dirs_exist_ok=True)
          if Path('snapshots/current/createinvite').exists():
              shutil.copytree('snapshots/current/createinvite', extra_dir / 'createinvite', dirs_exist_ok=True)
          p_name = f'portal_createinvite_{ts}' if changed else 'portal_createinvite'
          shutil.make_archive(f'release_assets/{p_name}', 'zip', extra_dir)
          shutil.rmtree(extra_dir, ignore_errors=True)
          "
          if [ "${{ steps.tracker.outputs.changed }}" = "true" ] && [ -n "${{ steps.tracker.outputs.archive_dir }}" ]; then
            cp "${{ steps.tracker.outputs.archive_dir }}/changes.json" release_assets/ 2>/dev/null || true
            cp "${{ steps.tracker.outputs.archive_dir }}/changes.diff" release_assets/ 2>/dev/null || true
          fi

      - name: Update baseline release
        if: (steps.tracker.outputs.first_run == 'true' || inputs.force_snapshot == true) && steps.tracker.outputs.changed != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tracker.outputs.variant }}
          name: "VACnet Snapshot — ${{ steps.tracker.outputs.variant }}"
          body: |
            Current production snapshot of the CS2 VACnet portal (**${{ steps.tracker.outputs.variant }}** variant) and portal/createinvite pages.

            Contains ready-to-use downloadable `.zip` archives with normalized DOM, parsed session metadata, and static assets.
            **Snapshot timestamp:** `${{ steps.tracker.outputs.timestamp }}`
          files: release_assets/*
          generate_release_notes: false

      - name: Create update release
        if: steps.tracker.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: update-${{ steps.tracker.outputs.timestamp }}
          name: "VACnet Update — ${{ steps.tracker.outputs.timestamp }} (${{ steps.tracker.outputs.variant }})"
          body: |
            VACnet site update detected (**${{ steps.tracker.outputs.variant }}** variant).

            **Last update detected:** `${{ steps.tracker.outputs.timestamp }}`
            **Changed sections:** `${{ steps.tracker.outputs.sections }}`
          files: release_assets/*
          generate_release_notes: false
          make_latest: true

      - name: Create issue
        if: steps.tracker.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create "site-update" --color "d73a4a" --description "VACnet site update" --force || true
          gh label create "automated" --color "0075ca" --description "Automated tracker update" --force || true
          gh issue create \
            --title "${{ steps.tracker.outputs.issue_title }}" \
            --body "VACnet site update detected for variant **${{ steps.tracker.outputs.variant }}**. Changed sections: ${{ steps.tracker.outputs.sections }}. See release [update-${{ steps.tracker.outputs.timestamp }}](https://github.com/${{ github.repository }}/releases/tag/update-${{ steps.tracker.outputs.timestamp }}) and the archived snapshot in the repository." \
            --label "site-update,automated" || \
          gh issue create \
            --title "${{ steps.tracker.outputs.issue_title }}" \
            --body "VACnet site update detected for variant **${{ steps.tracker.outputs.variant }}**. Changed sections: ${{ steps.tracker.outputs.sections }}. See release [update-${{ steps.tracker.outputs.timestamp }}](https://github.com/${{ github.repository }}/releases/tag/update-${{ steps.tracker.outputs.timestamp }})."


